[project]
name = "financial-simulation"
version = "0.1.0"
description = "A new pywire application"
requires-python = ">=3.12"
dependencies = [
    "stripe>=7.0.0",
    "sqlalchemy>=2.0.0",
    "yfinance>=0.2.0",
    "pandas>=2.0.0",
    "fredapi>=0.5.0",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "itsdangerous>=2.0.0",
    "bcrypt>=4.0.0",
    "pywire>=0.11.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pywire[cli]",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: exercises the running PyWire app end-to-end via TestClient",
    "db: database/model layer tests (src/models.py, src/database.py)",
    "web: styling/template consistency tests",
    "docker: Docker/Compose configuration tests",
]
